server: {port: 8080}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/betriebsrente}
    username: ${SPRING_DATASOURCE_USERNAME:botuser}
    password: ${SPRING_DATASOURCE_PASSWORD:lokal_sicher_123}
  jpa:
    hibernate.ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        remove-existing-vector-store-table: false
app:
  chunk: {size: 650, overlap: 130}
  security:
    admin-user: fachbereich
    admin-pass: Betriebsrente2024!
    team-user: team
    team-pass: Willkommen2024!
  ocr:
    enabled: true
    language: deu+eng
    min-chars-threshold: 200
