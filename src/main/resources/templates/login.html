<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden · Renten-Fachbot</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-card">
  <div class="login-brand">
    <div class="brand-mark" aria-hidden="true">BR</div>
    <div><h1 class="login-title">Renten-Fachbot</h1><p class="login-intro">Intern · nur Team &amp; Fachbereich</p></div>
  </div>
  <h2 class="login-heading">Willkommen zurück</h2>
  <p class="login-description">Melden Sie sich an, um auf den Fachwissen-Assistenten zuzugreifen.</p>
  <form method="post" th:action="@{/login}">
    <div class="login-field"><label class="field-label" for="username">Benutzer</label><input id="username" name="username" class="text-field" placeholder="Benutzername" autocomplete="username" required/></div>
    <div class="login-field"><label class="field-label" for="password">Passwort</label><input id="password" type="password" name="password" class="text-field" placeholder="Passwort" autocomplete="current-password" required/></div>
    <button class="button button-primary login-submit" type="submit">Anmelden</button>
  </form>
  <p class="login-footnote">Benutzerkonten und Rollen werden in PostgreSQL verwaltet.</p>
</main>
</body>
</html>
