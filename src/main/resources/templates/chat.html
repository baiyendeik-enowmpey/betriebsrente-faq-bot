<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Betriebsrente FAQ Bot</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 h-screen flex">
<div class="w-64 bg-white border-r p-4"><h1 class="font-bold">Betriebsrente Bot</h1><p class="text-xs text-slate-500 mb-6">intern - lokal - pgvector</p><select id="kategorie" class="w-full border rounded p-2 text-sm"><option>Alle</option><option>Auszahlung</option><option>Steuer</option><option>Arbeitgeberwechsel</option></select><div class="mt-8 text-xs text-slate-400"><b>Chunk:</b> 650 Tokens, 20% Overlap<br/>HNSW Cosine</div></div>
<div class="flex-1 flex flex-col"><div id="chatverlauf" class="flex-1 overflow-y-auto p-6 space-y-4"></div><div class="p-4 bg-white border-t flex gap-2"><input id="frage" class="flex-1 border rounded-lg p-3" placeholder="Frage z.B. Wie wird Einmalkapital versteuert?" onkeydown="if(event.key==='Enter') senden()"/><button onclick="senden()" class="bg-blue-600 text-white px-6 rounded-lg">Fragen</button></div></div>
<div class="w-80 bg-white border-l p-4 overflow-y-auto"><h2 class="font-semibold text-sm">Quellen</h2><div id="quellen" class="mt-3 space-y-3 text-xs"></div></div>
<script>
async function senden(){const frage=document.getElementById('frage').value; const kategorie=document.getElementById('kategorie').value; if(!frage) return; const v=document.getElementById('chatverlauf'); v.innerHTML+=`<div class="bg-blue-50 p-3 rounded ml-auto max-w-[70%]"><b>Du:</b> ${frage}</div>`; document.getElementById('frage').value=''; const res=await fetch('/api/chat',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({frage,kategorie})}); const data=await res.json(); v.innerHTML+=`<div class="bg-white border p-4 rounded max-w-[80%]"><b>Bot:</b><br><div class="whitespace-pre-wrap mt-2">${data.antwort}</div></div>`; v.scrollTop=v.scrollHeight; document.getElementById('quellen').innerHTML=data.quellen.map(q=>`<div class="border p-2 rounded"><b>${q.titel}</b> <span class="bg-slate-100 px-1 rounded">${q.kategorie}</span><p class="mt-1">${q.text}</p></div>`).join('');}
</script></body></html>
