services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: betriebsrente
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: lokal_sicher_123
    ports: ["5444:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d betriebsrente"]
      interval: 5s
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_LOAD_TIMEOUT: 10m
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
  app:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8090:8090"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/betriebsrente
      SPRING_DATASOURCE_USERNAME: botuser
      SPRING_DATASOURCE_PASSWORD: lokal_sicher_123
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      APP_SECURITY_BOOTSTRAP_ADMIN_USERNAME: ${APP_SECURITY_BOOTSTRAP_ADMIN_USERNAME:-fachbereich}
      APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD: ${APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:-Betriebsrente2024!}
      APP_SECURITY_BOOTSTRAP_TEAM_USERNAME: ${APP_SECURITY_BOOTSTRAP_TEAM_USERNAME:-team}
      APP_SECURITY_BOOTSTRAP_TEAM_PASSWORD: ${APP_SECURITY_BOOTSTRAP_TEAM_PASSWORD:-Willkommen2024!}
volumes:
  pgdata:
  ollama_data:
