services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: betriebsrente
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: lokal_sicher_123
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser"]
      interval: 5s
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_LOAD_TIMEOUT: 10m
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
  app:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/betriebsrente
      SPRING_DATASOURCE_USERNAME: botuser
      SPRING_DATASOURCE_PASSWORD: lokal_sicher_123
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
volumes:
  pgdata:
  ollama_data:
